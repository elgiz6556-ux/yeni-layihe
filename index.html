<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>X-Chat ELITE</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #007aff;
            --bg: #090a0f;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            background: radial-gradient(circle at top right, #1e2a4a, #090a0f);
            color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* Modern Header */
        header {
            padding: 50px 20px 15px;
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100;
        }

        .user-profile { display: flex; align-items: center; gap: 12px; }
        .user-profile img { 
            width: 44px; height: 44px; border-radius: 14px; 
            border: 2px solid var(--primary); object-fit: cover;
            box-shadow: 0 0 15px rgba(0, 122, 255, 0.3);
        }
        .room-info b { font-size: 17px; letter-spacing: 0.5px; }
        .status-dot { width: 8px; height: 8px; background: #34c759; border-radius: 50%; display: inline-block; margin-right: 5px; box-shadow: 0 0 8px #34c759; }

        /* Chat Area */
        #chat { 
            flex: 1; overflow-y: auto; padding: 20px; 
            display: flex; flex-direction: column; gap: 15px;
            background: transparent;
        }

        .msg-container { display: flex; flex-direction: column; max-width: 80%; position: relative; }
        .msg-container.me { align-self: flex-end; align-items: flex-end; }
        .msg-container.other { align-self: flex-start; align-items: flex-start; }

        .bubble {
            padding: 12px 16px; border-radius: 20px; font-size: 15px; line-height: 1.5;
            position: relative; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .me .bubble { 
            background: linear-gradient(135deg, #007aff, #005bb5); 
            border-bottom-right-radius: 4px; color: white;
        }
        .other .bubble { 
            background: var(--glass); 
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-bottom-left-radius: 4px; 
        }

        .msg-info { font-size: 10px; opacity: 0.5; margin-top: 4px; font-weight: 600; text-transform: uppercase; }
        .sender-name { font-size: 11px; font-weight: bold; color: var(--primary); margin-bottom: 4px; }

        /* Ghost Effect */
        .ghost-msg .bubble { 
            background: linear-gradient(45deg, #434343, #000000) !important;
            border: 1px dashed #666; animation: vanish 12s forwards;
        }

        /* Modern Input Area */
        .footer {
            padding: 15px 15px 35px;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            display: flex; align-items: center; gap: 10px;
        }

        .input-wrapper {
            flex: 1; background: rgba(255,255,255,0.07);
            border-radius: 20px; padding: 5px 15px;
            display: flex; align-items: center; border: 1px solid var(--glass-border);
            transition: 0.3s;
        }
        .input-wrapper:focus-within { border-color: var(--primary); background: rgba(255,255,255,0.1); }

        #mInp {
            border: none; background: transparent; color: white;
            padding: 10px 0; width: 100%; outline: none; font-size: 16px;
        }

        .action-btn {
            width: 44px; height: 44px; border-radius: 15px; border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s; font-size: 20px;
        }
        .send-btn { background: var(--primary); color: white; }
        .ghost-btn { background: var(--glass); color: #fff; }
        .ghost-btn.active { background: #ff3b30; box-shadow: 0 0 15px #ff3b30; }
        .mic-btn { background: var(--glass); color: #fff; }
        .mic-btn.rec { background: #ff3b30; animation: pulse 1s infinite; }

        /* Modals */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1c1c1e; width: 100%; max-width: 400px;
            border-radius: 25px; padding: 25px; border: 1px solid var(--glass-border);
        }

        @keyframes vanish { 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-20px) scale(0.9); pointer-events: none; } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        audio { filter: invert(1) hue-rotate(180deg) brightness(1.5); height: 35px; width: 200px; }
    </style>
</head>
<body>

<header>
    <div class="user-profile" onclick="openModal('profModal')">
        <img id="myAva" src="https://ui-avatars.com/api/?name=User">
        <div class="room-info">
            <b id="roomName">Qlobal Çat</b>
            <div style="font-size: 11px; opacity: 0.6;"><span class="status-dot"></span>Online</div>
        </div>
    </div>
    <div style="display: flex; gap: 15px;">
        <span onclick="renderRooms()" style="font-size: 22px; cursor: pointer;">🏢</span>
        <span onclick="location.reload()" style="font-size: 22px; cursor: pointer;">🔄</span>
    </div>
</header>

<div id="chat"></div>

<div class="footer">
    <button class="action-btn ghost-btn" id="gBtn" onclick="toggleGhost()">👻</button>
    <div class="input-wrapper">
        <input type="text" id="mInp" placeholder="Mesajınızı yazın..." onkeypress="if(event.key==='Enter') sendText()">
    </div>
    <button class="action-btn mic-btn" id="micBtn" onclick="handleVoice()">🎤</button>
    <button class="action-btn send-btn" onclick="sendText()">➤</button>
</div>

<div id="profModal" class="modal" onclick="closeModals()"><div class="modal-content" onclick="event.stopPropagation()">
    <h2 style="margin-bottom: 20px; text-align: center;">Profil</h2>
    <button class="action-btn" style="width: 100%; background: #2c2c2e; margin-bottom: 10px; color: #fff;" onclick="changeNick()">Ləqəbi Dəyiş</button>
    <button class="action-btn" style="width: 100%; background: #ff3b30; color: #fff;" onclick="hardReset()">🛑 Hesabdan Çıx</button>
</div></div>

<div id="roomModal" class="modal" onclick="closeModals()"><div class="modal-content" onclick="event.stopPropagation()">
    <h3 style="margin-bottom: 15px;">Otaq Seçimi</h3>
    <div id="roomList" style="max-height: 300px; overflow-y: auto;"></div>
    <button class="action-btn" style="width: 100%; background: var(--primary); color: #fff; margin-top: 15px;" onclick="createRoom()">➕ Yeni Otaq</button>
</div></div>

<script>
    const SB_URL = 'https://pyknspxnwnilhqsazidj.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5a25zcHhud25pbGhxc2F6aWRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcyODE0MzAsImV4cCI6MjA4Mjg1NzQzMH0.NlU2cVFug6PH6rZ4RM-344-tPnoYQVrOzWKXOn5y3eU';
    const sb = supabase.createClient(SB_URL, SB_KEY);

    let user = JSON.parse(localStorage.getItem('x_user')) || null;
    let myRooms = JSON.parse(localStorage.getItem('x_rooms')) || [{ name: 'Qlobal Çat' }];
    let curRoom = myRooms[0];
    let isGhost = false;
    let recorder, chunks = [];

    if(!user) {
        let n = prompt("Sizi necə çağıraq?");
        user = { nick: n || 'Anonim', ava: `https://ui-avatars.com/api/?name=${n || 'A'}&background=random&color=fff` };
        localStorage.setItem('x_user', JSON.stringify(user));
        location.reload();
    }

    async function loadMsgs() {
        const { data } = await sb.from('messages').select('*').eq('group_id', curRoom.name).order('created_at', {ascending:true});
        const chat = document.getElementById('chat'); chat.innerHTML = '';
        if(data) data.forEach(m => {
            let j = {}; try { j = JSON.parse(m.content); } catch { j = {text: m.content}; }
            const isMe = m.nickname === user.nick;
            const time = new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            const container = document.createElement('div');
            container.className = `msg-container ${isMe ? 'me' : 'other'} ${j.isGhost ? 'ghost-msg' : ''}`;
            
            let contentHtml = j.type === 'voice' ? `<audio controls src="${j.url}"></audio>` : `<span>${j.text || ''}</span>`;
            
            container.innerHTML = `
                ${!isMe ? `<span class="sender-name">${m.nickname}</span>` : ''}
                <div class="bubble">${contentHtml}</div>
                <span class="msg-info">${time} ${j.isGhost ? '• 👻 Ghost' : ''}</span>
            `;
            chat.appendChild(container);
            if(j.isGhost && isMe) setTimeout(() => sb.from('messages').delete().eq('id', m.id).then(loadMsgs), 12000);
        });
        chat.scrollTop = chat.scrollHeight;
    }

    async function send(payload) {
        payload.isGhost = isGhost;
        if(isGhost) toggleGhost();
        await sb.from('messages').insert([{ nickname: user.nick, group_id: curRoom.name, content: JSON.stringify(payload) }]);
        loadMsgs();
    }

    function sendText() {
        const i = document.getElementById('mInp'); if(!i.value) return;
        send({ text: i.value, type: 'text' }); i.value = '';
    }

    async function handleVoice() {
        const btn = document.getElementById('micBtn');
        if (!recorder || recorder.state === "inactive") {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            recorder = new MediaRecorder(stream); chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = async () => {
                btn.classList.remove('rec');
                const blob = new Blob(chunks, { type: 'audio/ogg' });
                const name = `v_${Date.now()}.ogg`;
                await sb.storage.from('audio_messages').upload(name, blob);
                const url = `${SB_URL}/storage/v1/object/public/audio_messages/${name}`;
                send({ type: 'voice', url: url });
            };
            recorder.start(); btn.classList.add('rec');
        } else { recorder.stop(); }
    }

    function toggleGhost() { isGhost = !isGhost; document.getElementById('gBtn').classList.toggle('active', isGhost); }
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModals() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); }

    function renderRooms() {
        const list = document.getElementById('roomList'); list.innerHTML = '';
        myRooms.forEach(r => {
            const d = document.createElement('div');
            d.style = "padding: 15px; background: #2c2c2e; margin-bottom: 8px; border-radius: 12px; cursor: pointer;";
            d.innerText = "🏠 " + r.name;
            d.onclick = () => { curRoom = r; document.getElementById('roomName').innerText = r.name; closeModals(); loadMsgs(); };
            list.appendChild(d);
        });
        openModal('roomModal');
    }

    function createRoom() {
        const n = prompt("Otaq adı:"); if(!n) return;
        myRooms.push({name: n}); localStorage.setItem('x_rooms', JSON.stringify(myRooms));
        renderRooms();
    }

    function changeNick() {
        const n = prompt("Yeni ləqəb:"); if(!n) return;
        user.nick = n; localStorage.setItem('x_user', JSON.stringify(user));
        location.reload();
    }

    function hardReset() { localStorage.clear(); location.reload(); }

    document.getElementById('myAva').src = user.ava;
    loadMsgs();
    sb.channel('any').on('postgres_changes', {event:'*', schema:'public', table:'messages'}, loadMsgs).subscribe();
</script>
</body>
</html>
