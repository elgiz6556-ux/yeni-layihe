<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>X-Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b0d10; --panel: #16191f; --blue: #3b82f6; --me: #2b5278; --other: #1c2128; --text: #ffffff; --ghost: linear-gradient(45deg, #4b5563, #1f2937); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        /* HEADER & UI */
        header { background: var(--panel); padding: 45px 15px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 100; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; }
        .u-info { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .u-info img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--blue); object-fit: cover; }
        
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        .msg-box { max-width: 82%; padding: 10px 14px; border-radius: 18px; position: relative; font-size: 15px; animation: pop 0.2s ease-out; word-wrap: break-word; }
        .me { align-self: flex-end; background: var(--me); border-bottom-right-radius: 4px; }
        .other { align-self: flex-start; background: var(--other); border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }
        .ghost-msg { background: var(--ghost) !important; border: 1px dashed rgba(255,255,255,0.4); animation: evaporate 10s forwards; }

        /* FOOTER */
        .footer { background: var(--panel); padding: 10px 10px 35px; display: flex; align-items: center; gap: 10px; }
        .inp-wrap { flex: 1; background: #000; border-radius: 25px; padding: 0 15px; display: flex; align-items: center; border: 1px solid rgba(255,255,255,0.1); }
        #mInp { border: none; background: transparent; color: #fff; padding: 12px 0; flex: 1; outline: none; }
        .ghost-btn { width: 35px; height: 35px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; transition: 0.3s; cursor: pointer; }
        .ghost-btn.active { background: var(--blue); box-shadow: 0 0 10px var(--blue); border: none; }

        /* MODALS (SHEETS) */
        .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; display: none; align-items: flex-end; backdrop-filter: blur(8px); }
        .sheet-overlay.active { display: flex; }
        .sheet { width: 100%; background: var(--panel); border-radius: 30px 30px 0 0; padding: 25px; transform: translateY(100%); transition: 0.3s; max-height: 85vh; overflow-y: auto; }
        .sheet-overlay.active .sheet { transform: translateY(0); }
        .sheet-btn { width: 100%; padding: 15px; background: rgba(255,255,255,0.05); border: none; color: #fff; border-radius: 15px; margin-bottom: 10px; text-align: left; display: flex; align-items: center; gap: 12px; cursor: pointer; }

        @keyframes evaporate { 80% { opacity: 0.5; filter: blur(2px); } 100% { opacity: 0; display: none; } }
        @keyframes pop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <div class="top-bar">
            <div class="u-info" onclick="openSheet('settingsSheet')">
                <img id="headAva" src="">
                <div><b id="roomTitle">Qlobal Çat</b><div id="mood" style="font-size:10px; color:#10b981">● Aktiv</div></div>
            </div>
            <div style="display:flex; gap:18px; font-size:22px; cursor: pointer;">
                <span onclick="openFriends()" style="position:relative">👥<div id="reqDot" style="display:none; width:10px; height:10px; background:red; border-radius:50%; position:absolute; top:-2px; right:-2px"></div></span>
                <span onclick="renderRooms()">🏠</span>
            </div>
        </div>
    </header>

    <div id="chat"></div>

    <div class="footer">
        <span onclick="openSheet('attachSheet')" style="font-size:25px; color:var(--blue); cursor: pointer;">+</span>
        <div class="ghost-btn" id="gBtn" onclick="toggleGhost()">👻</div>
        <div class="inp-wrap"><input type="text" id="mInp" placeholder="Mesaj..." onkeypress="if(event.key==='Enter') sendMsg()"></div>
        <button onclick="sendMsg()" style="background:var(--blue); border:none; color:#fff; width:40px; height:40px; border-radius:50%; cursor: pointer;">➤</button>
    </div>

    <div id="roomsSheet" class="sheet-overlay" onclick="closeSheets()"><div class="sheet" onclick="event.stopPropagation()">
        <h3>Otaqlar</h3>
        <button class="sheet-btn" onclick="createRoom()" style="background:var(--blue); font-weight:bold">➕ Yeni Otaq Yarat</button>
        <div id="roomsList" style="margin-top:10px"></div>
    </div></div>

    <div id="friendsSheet" class="sheet-overlay" onclick="closeSheets()"><div class="sheet" onclick="event.stopPropagation()">
        <h3>Dostlar və İstəklər</h3>
        <div id="socialContent"></div>
    </div></div>

    <div id="settingsSheet" class="sheet-overlay" onclick="closeSheets()"><div class="sheet" onclick="event.stopPropagation()">
        <h3>Profil Ayarları</h3>
        <div style="text-align:center; margin:15px 0">
            <img id="setAva" style="width:80px; height:80px; border-radius:50%; border:2px solid var(--blue); object-fit:cover">
        </div>
        <button class="sheet-btn" onclick="logout()" style="color:red; justify-content: center;">🛑 Hesabdan Çıx</button>
    </div></div>

    <div id="attachSheet" class="sheet-overlay" onclick="closeSheets()"><div class="sheet">
        <button class="sheet-btn" onclick="sendLoc()">📍 Məkan Paylaş</button>
        <button class="sheet-btn" onclick="document.getElementById('fInp').click()">🖼 Şəkil Göndər</button>
        <input type="file" id="fInp" hidden onchange="uploadImg()">
    </div></div>

<script>
    const SB_URL = 'https://pyknspxnwnilhqsazidj.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5a25zcHhud25pbGhxc2F6aWRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcyODE0MzAsImV4cCI6MjA4Mjg1NzQzMH0.NlU2cVFug6PH6rZ4RM-344-tPnoYQVrOzWKXOn5y3eU';
    const sb = supabase.createClient(SB_URL, SB_KEY);

    let user = JSON.parse(localStorage.getItem('x_user'));
    let curRoom = { name: 'General' };
    let isGhost = false;
    let myRooms = JSON.parse(localStorage.getItem('x_rooms')) || [{ name: 'General', isZone: false, pass: null }];
    let myFriends = JSON.parse(localStorage.getItem('x_friends')) || [];

    // --- SİSTEMİ BAŞLAT ---
    if(!user) {
        const n = prompt("X-Chat-a xoş gəldiniz! Ləqəbinizi qeyd edin:");
        user = { nick: n || 'Anonim', ava: `https://ui-avatars.com/api/?name=${n || 'Anonim'}&background=random` };
        localStorage.setItem('x_user', JSON.stringify(user));
        location.reload();
    }

    function init() {
        document.getElementById('headAva').src = user.ava;
        document.getElementById('setAva').src = user.ava;
        loadMsgs();
        syncMood();
        
        sb.channel('db').on('postgres_changes', {event:'*', schema:'public', table:'messages'}, (p) => {
            if(p.new.group_id === curRoom.name) loadMsgs();
            if(p.new.group_id === 'REQ_'+user.nick) document.getElementById('reqDot').style.display='block';
        }).subscribe();
    }

    // --- MESAJLAR ---
    async function loadMsgs() {
        const { data } = await sb.from('messages').select('*').eq('group_id', curRoom.name).order('created_at', {ascending:true});
        const chat = document.getElementById('chat'); chat.innerHTML = '';
        data.forEach(m => {
            let j = {}; try { j = JSON.parse(m.content); } catch { j = {text: m.content}; }
            const isMe = m.nickname === user.nick;
            const div = document.createElement('div');
            div.className = `msg-box ${isMe ? 'me' : 'other'} ${j.mode === 'ghost' ? 'ghost-msg' : ''}`;
            
            let body = j.type === 'loc' ? `<a href="${j.url}" target="_blank" style="color:cyan">📍 Məkan Paylaşdı</a>` : 
                       (j.type === 'img' ? `<img src="${j.url}" style="max-width:100%; border-radius:10px">` : `<div>${j.text || ''}</div>`);
            
            div.innerHTML = `${!isMe ? `<b onclick="viewUser('${m.nickname}','${j.ava}')" style="font-size:11px; color:var(--blue); cursor:pointer">${m.nickname}</b><br>` : ''}${body}`;
            chat.appendChild(div);

            if(j.mode === 'ghost' && isMe) setTimeout(() => sb.from('messages').delete().eq('id', m.id), 10000);
        });
        chat.scrollTop = chat.scrollHeight;
    }

    async function sendMsg(extra = {}) {
        const inp = document.getElementById('mInp');
        if(!inp.value && !extra.type) return;
        const payload = { text: inp.value, ava: user.ava, mode: isGhost ? 'ghost' : 'normal', ...extra };
        inp.value = '';
        if(isGhost) toggleGhost();
        await sb.from('messages').insert([{ nickname: user.nick, group_id: curRoom.name, content: JSON.stringify(payload) }]);
    }

    // --- OTAQ SİSTEMİ ---
    function createRoom() {
        const n = prompt("Otaq adı nə olsun?"); if(!n) return;
        const isZ = confirm("MƏKAN KİLİDLİ olsun? (Yalnız sizin yaxınınızda olanlar girə biləcək)");
        const p = prompt("Otaq şifrəsi təyin edin (Şifrəsiz istəyirsinizsə boş qoyun):") || null;

        if(isZ) {
            navigator.geolocation.getCurrentPosition(pos => {
                const roomObj = { name: n, lat: pos.coords.latitude, lng: pos.coords.longitude, isZone: true, pass: p };
                myRooms.push(roomObj);
                saveRooms();
                enterRoom(roomObj);
            }, () => alert("Məkan otağı yaratmaq üçün GPS icazəsi lazımdır!"));
        } else {
            const roomObj = { name: n, isZone: false, pass: p };
            myRooms.push(roomObj);
            saveRooms();
            enterRoom(roomObj);
        }
    }

    function renderRooms() {
        const list = document.getElementById('roomsList'); list.innerHTML = '';
        myRooms.forEach(r => {
            const btn = document.createElement('button');
            btn.className = 'sheet-btn';
            btn.innerHTML = `🏠 ${r.name} ${r.isZone ? '📍' : ''} ${r.pass ? '🔒' : ''}`;
            btn.onclick = () => tryJoin(r);
            list.appendChild(btn);
        });
        openSheet('roomsSheet');
    }

    function tryJoin(r) {
        if(r.pass && prompt("Bu otaq şifrəlidir. Şifrəni daxil edin:") !== r.pass) return alert("Səhv şifrə!");
        if(r.isZone) {
            alert("Məkanınız yoxlanılır...");
            navigator.geolocation.getCurrentPosition(pos => {
                if(getDist(pos.coords.latitude, pos.coords.longitude, r.lat, r.lng) > 0.2) return alert("Təəssüf, bu otağa girmək üçün məkana çox uzaqsınız!");
                enterRoom(r);
            }, () => alert("GPS icazəsi verilmədi."));
        } else { enterRoom(r); }
    }

    function enterRoom(r) { curRoom = r; document.getElementById('roomTitle').innerText = r.name; closeSheets(); loadMsgs(); }

    // --- SOSİAL & DM ---
    function viewUser(nick, ava) {
        if(nick === user.nick) return;
        if(confirm(`${nick} adlı istifadəçiyə Şəxsi Mesaj (DM) yazmaq istəyirsiniz?`)) {
            const dmID = "DM_" + [user.nick, nick].sort().join("_");
            enterRoom({ name: dmID });
        }
    }

    async function openFriends() {
        document.getElementById('reqDot').style.display='none';
        const { data } = await sb.from('messages').select('*').eq('group_id', 'REQ_'+user.nick);
        const cont = document.getElementById('socialContent'); cont.innerHTML = '<h4>Gələn İstəklər</h4>';
        if(data.length === 0) cont.innerHTML += '<p style="font-size:13px; color:gray; margin-top:10px;">Hələ ki, yeni istək yoxdur.</p>';
        data.forEach(req => {
            const d = JSON.parse(req.content);
            cont.innerHTML += `<div class="sheet-btn" onclick="acceptFriend('${d.from}')">🤝 ${d.from} (Qəbul et)</div>`;
        });
        openSheet('friendsSheet');
    }

    // --- TOOLS ---
    function toggleGhost() { isGhost = !isGhost; document.getElementById('gBtn').classList.toggle('active', isGhost); }
    function sendLoc() { navigator.geolocation.getCurrentPosition(p => sendMsg({type:'loc', url: `https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`})); closeSheets(); }
    
    // Məsafə hesablama düsturu (Haversine)
    function getDist(la1, lo1, la2, lo2) {
        const R = 6371; const dLat = (la2-la1)*Math.PI/180; const dLon = (lo2-lo1)*Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    
    function syncMood() { const h = new Date().getHours(); document.body.style.background = (h>19||h<7) ? "#05070a" : "#0b0d10"; }
    function saveRooms() { localStorage.setItem('x_rooms', JSON.stringify(myRooms)); }
    function openSheet(id) { document.getElementById(id).classList.add('active'); }
    function closeSheets() { document.querySelectorAll('.sheet-overlay').forEach(s => s.classList.remove('active')); }
    function logout() { localStorage.clear(); location.reload(); }
    
    init();
</script>
</body>
</html>
