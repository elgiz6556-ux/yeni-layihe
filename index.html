<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>X-Chat TITAN v2.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #007aff; --bg: #090a10; --card: rgba(255, 255, 255, 0.06); --border: rgba(255, 255, 255, 0.12); --t: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; }
        body { background: #090a10; color: var(--t); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        /* Header & Nav */
        header { padding: 50px 20px 15px; background: rgba(10, 10, 15, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .u-chip { display: flex; align-items: center; gap: 10px; }
        .u-chip img { width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--p); }

        .nav-tabs { display: flex; background: #000; border-bottom: 1px solid var(--border); }
        .tab { flex: 1; text-align: center; padding: 15px; font-size: 13px; font-weight: 600; opacity: 0.4; cursor: pointer; transition: 0.3s; }
        .tab.active { opacity: 1; color: var(--p); border-bottom: 2px solid var(--p); }

        /* Content Areas */
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg-wrap { display: flex; flex-direction: column; max-width: 80%; animation: pop 0.2s ease; }
        .msg-wrap.me { align-self: flex-end; align-items: flex-end; }
        .msg-wrap.other { align-self: flex-start; align-items: flex-start; }
        .bubble { padding: 12px 16px; border-radius: 18px; font-size: 15px; position: relative; }
        .me .bubble { background: var(--p); border-bottom-right-radius: 4px; }
        .other .bubble { background: var(--card); border-bottom-left-radius: 4px; }

        .item-list { background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

        /* Footer */
        .footer { padding: 15px 15px 35px; background: rgba(10,10,15,0.9); display: flex; gap: 10px; border-top: 1px solid var(--border); }
        .inp-box { flex: 1; background: var(--card); border-radius: 20px; padding: 0 15px; display: flex; align-items: center; border: 1px solid var(--border); }
        input { background: transparent; border: none; color: #fff; padding: 12px 0; width: 100%; outline: none; }

        .btn { width: 44px; height: 44px; border-radius: 12px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        
        /* Modals */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; padding: 40px 20px; z-index: 1000; }
        .modal.active { display: flex; }
        @keyframes pop { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

<header>
    <div class="u-chip">
        <img id="myAva" src="">
        <div><b id="headNick">Yüklənir...</b><div id="roomTitle" style="font-size:10px; color:var(--p)">Qlobal</div></div>
    </div>
    <div style="display:flex; gap:15px">
        <span onclick="toggleModal('roomModal')" style="cursor:pointer">🏠</span>
    </div>
</header>

<div class="nav-tabs">
    <div class="tab active" onclick="setMode('global', this)">Qlobal</div>
    <div class="tab" onclick="setMode('dm', this)">Mesajlar</div>
    <div class="tab" onclick="setMode('friends', this)">Dostlar</div>
</div>

<div id="chat"></div>

<div class="footer" id="fArea">
    <div class="inp-box"><input type="text" id="mInp" placeholder="Mesaj yaz..." onkeypress="if(event.key==='Enter') send()"></div>
    <button class="btn" onclick="send()" style="background:var(--p); color:#white">➤</button>
</div>

<div id="roomModal" class="modal">
    <h2 style="margin-bottom:20px">Otaqlar</h2>
    <div id="roomList" style="flex:1; overflow-y:auto"></div>
    <button onclick="createRoom()" style="padding:15px; background:var(--p); border:none; color:#fff; border-radius:12px; margin-top:10px">+ Otaq Yarat</button>
    <button onclick="toggleModal('roomModal')" style="margin-top:10px; background:none; color:#777; border:none">Bağla</button>
</div>

<script>
    const SB_URL = 'https://pyknspxnwnilhqsazidj.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5a25zcHhud25pbGhxc2F6aWRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcyODE0MzAsImV4cCI6MjA4Mjg1NzQzMH0.NlU2cVFug6PH6rZ4RM-344-tPnoYQVrOzWKXOn5y3eU';
    const sb = supabase.createClient(SB_URL, SB_KEY);

    let user = JSON.parse(localStorage.getItem('x_user'));
    let curMode = 'global'; 
    let curRoom = 'Qlobal'; 
    let curDM = null; 

    if(!user) {
        let n = prompt("Ləqəb:");
        user = { nick: n || 'Anonim', ava: `https://ui-avatars.com/api/?name=${n}&background=random` };
        localStorage.setItem('x_user', JSON.stringify(user));
        location.reload();
    }

    // --- ƏSAS FUNKSİYA: MƏLUMAT SÜZÜLMƏSİ ---
    async function load() {
        const box = document.getElementById('chat');
        box.innerHTML = '<p style="text-align:center; opacity:0.5">Yüklənir...</p>';

        if (curMode === 'global') {
            // PROBLEM HƏLLİ 1: Yalnız bu otağın və DM OLMAYAN mesajlarını gətir
            const { data } = await sb.from('messages').select('*')
                .eq('group_id', curRoom)
                .eq('is_dm', false) 
                .order('created_at', {ascending: true});
            renderMessages(data);
            document.getElementById('fArea').style.display = 'flex';
        } 
        else if (curMode === 'dm') {
            if (!curDM) {
                // DM siyahısını göstər (Sənə yazanlar)
                box.innerHTML = '<h3>Şəxsi Söhbətlər</h3>';
                const { data } = await sb.from('messages').select('nickname').eq('recipient', user.nick).eq('is_dm', true);
                let uniqueNicks = [...new Set(data?.map(m => m.nickname))];
                uniqueNicks.forEach(n => {
                    box.innerHTML += `<div class="item-list" onclick="startDM('${n}')"><span>✉️ ${n}</span> <span>▶</span></div>`;
                });
            } else {
                // Səninlə o adam arasındakı özəl mesajlar
                const { data } = await sb.from('messages').select('*')
                    .eq('is_dm', true)
                    .or(`and(nickname.eq.${user.nick},recipient.eq.${curDM}),and(nickname.eq.${curDM},recipient.eq.${user.nick})`)
                    .order('created_at', {ascending: true});
                renderMessages(data);
                document.getElementById('fArea').style.display = 'flex';
            }
        } 
        else if (curMode === 'friends') {
            // PROBLEM HƏLLİ 2: Burada mesaj görünə bilməz, yalnız dostlar
            const { data } = await sb.from('friends').select('*').or(`user_me.eq.${user.nick},user_friend.eq.${user.nick}`);
            box.innerHTML = '<h3>Dostların</h3>';
            data?.forEach(f => {
                const fn = f.user_me === user.nick ? f.user_friend : f.user_me;
                box.innerHTML += `<div class="item-list"><span>👤 ${fn}</span> <button onclick="startDM('${fn}')" style="background:var(--p); border:none; color:#fff; padding:5px 10px; border-radius:8px">Yaz</button></div>`;
            });
            document.getElementById('fArea').style.display = 'none';
        }
    }

    function renderMessages(data) {
        const box = document.getElementById('chat');
        box.innerHTML = '';
        data?.forEach(m => {
            let content = m.content;
            try { content = JSON.parse(m.content).text || m.content; } catch(e) {}
            const isMe = m.nickname === user.nick;
            box.innerHTML += `
                <div class="msg-wrap ${isMe ? 'me' : 'other'}">
                    <small style="font-size:10px; opacity:0.6">${m.nickname}</small>
                    <div class="bubble">${content}</div>
                </div>`;
        });
        box.scrollTop = box.scrollHeight;
    }

    async function send() {
        const inp = document.getElementById('mInp');
        if(!inp.value.trim()) return;

        const msg = {
            nickname: user.nick,
            content: inp.value,
            is_dm: curMode === 'dm',
            recipient: curMode === 'dm' ? curDM : null,
            group_id: curMode === 'global' ? curRoom : null
        };

        inp.value = '';
        await sb.from('messages').insert([msg]);
        load();
    }

    // --- OTAQ SİSTEMİ (GPS DƏSTƏKLİ) ---
    async function createRoom() {
        const name = prompt("Otaq adı:");
        if(!name) return;
        const pass = prompt("Şifrə (yoxdursa boş qoy):") || null;
        const useGps = confirm("Yalnız yaxınlıqdakı insanlar görsün?");

        let lat = null, lon = null;
        if(useGps) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                await sb.from('rooms').insert([{ name, password: pass, is_gps: true, lat: pos.coords.latitude, lon: pos.coords.longitude, creator: user.nick }]);
                listRooms();
            });
        } else {
            await sb.from('rooms').insert([{ name, password: pass, is_gps: false, creator: user.nick }]);
            listRooms();
        }
    }

    async function listRooms() {
        const list = document.getElementById('roomList');
        list.innerHTML = 'Yüklənir...';
        
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const { data } = await sb.from('rooms').select('*');
            list.innerHTML = '';
            data?.forEach(r => {
                // GPS Filtri
                if(r.is_gps) {
                    const dist = Math.sqrt(Math.pow(r.lat - pos.coords.latitude, 2) + Math.pow(r.lon - pos.coords.longitude, 2));
                    if(dist > 0.1) return; // 10km-dən uzaqdırsa göstərmə
                }
                list.innerHTML += `<div class="item-list" onclick="joinRoom('${r.name}', '${r.password}')">
                    <span>${r.is_gps ? '📍' : '🌍'} ${r.name}</span>
                    <small>${r.password ? '🔒' : '🔓'}</small>
                </div>`;
            });
        });
    }

    function joinRoom(name, pass) {
        if(pass && pass !== "null") {
            const check = prompt("Şifrə:");
            if(check !== pass) return alert("Səhv şifrə!");
        }
        curRoom = name;
        curMode = 'global';
        document.getElementById('roomTitle').innerText = name;
        toggleModal('roomModal');
        load();
    }

    // --- KÖMƏKÇİ ---
    function setMode(m, el) {
        curMode = m;
        curDM = null;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        load();
    }
    function startDM(n) { curDM = n; curMode = 'dm'; load(); }
    function toggleModal(id) { 
        const m = document.getElementById(id);
        m.classList.toggle('active');
        if(m.classList.contains('active')) listRooms();
    }

    document.getElementById('myAva').src = user.ava;
    document.getElementById('headNick').innerText = user.nick;
    load();
    sb.channel('any').on('postgres_changes', {event:'*', schema:'public', table:'messages'}, load).subscribe();
</script>
</body>
</html>
