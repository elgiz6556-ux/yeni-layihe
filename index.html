<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>X-Chat ULTRA</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b0d10; --card: #16191f; --blue: #007aff; --text: #ffffff; --ghost: linear-gradient(45deg, #2c3e50, #000000); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        /* Server Status Bar */
        #srv { background: #ff3b30; color: #fff; font-size: 11px; text-align: center; padding: 4px; font-weight: bold; transition: 0.5s; }
        #srv.ok { background: #34c759; }

        header { background: rgba(22, 25, 31, 0.9); backdrop-filter: blur(10px); padding: 40px 15px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .top { display: flex; justify-content: space-between; align-items: center; }
        .u-info { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .u-info img { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--blue); object-fit: cover; background: #222; }

        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 20px; font-size: 15px; position: relative; animation: pop 0.2s ease; line-height: 1.4; }
        .me { align-self: flex-end; background: var(--blue); border-bottom-right-radius: 4px; }
        .other { align-self: flex-start; background: #262629; border-bottom-left-radius: 4px; }
        .ghost-msg { background: var(--ghost) !important; border: 1px dashed #777; animation: fadeOut 15s forwards; }
        .sender { font-size: 11px; font-weight: bold; color: #58ccff; margin-bottom: 4px; display: block; }

        .footer { background: var(--card); padding: 10px 10px 35px; display: flex; align-items: center; gap: 10px; }
        .g-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid #444; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; }
        .g-btn.active { background: #ff3b30; box-shadow: 0 0 10px #ff3b30; border: none; }
        .input-box { flex: 1; background: #000; border-radius: 25px; padding: 0 15px; border: 1px solid rgba(255,255,255,0.1); }
        #mInp { border: none; background: transparent; color: #fff; padding: 12px 0; width: 100%; outline: none; font-size: 16px; }
        .mic { width: 42px; height: 42px; border-radius: 50%; background: #2c2c2e; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; }
        .mic.rec { background: #ff3b30; animation: pulse 1s infinite; }

        .sheet-box { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; display: none; align-items: flex-end; }
        .sheet-box.active { display: flex; }
        .sheet { width: 100%; background: #1c1c1e; border-radius: 30px 30px 0 0; padding: 30px; transform: translateY(100%); transition: 0.3s; }
        .sheet-box.active .sheet { transform: translateY(0); }
        .btn { width: 100%; padding: 16px; background: #2c2c2e; border: none; color: #fff; border-radius: 15px; margin-bottom: 12px; font-size: 16px; font-weight: bold; }

        @keyframes fadeOut { 80% { opacity: 1; } 100% { opacity: 0; transform: scale(0.9); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        @keyframes pop { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

<div id="srv">Server yoxlanılır...</div>

<header>
    <div class="top">
        <div class="u-info" onclick="openSheet('profSheet')">
            <img id="myAva" src="">
            <div><b id="curRoomName">Qlobal Çat</b><div style="font-size:10px; color:#34c759">● Online</div></div>
        </div>
        <div style="font-size: 26px; cursor: pointer" onclick="renderRooms()">🏠</div>
    </div>
</header>

<div id="chat"></div>

<div class="footer">
    <div class="g-btn" id="gBtn" onclick="toggleGhost()">👻</div>
    <div class="input-box"><input type="text" id="mInp" placeholder="Mesaj yaz..." onkeypress="if(event.key==='Enter') sendText()"></div>
    <div class="mic" id="micBtn" onclick="handleVoice()">🎤</div>
    <button onclick="sendText()" style="background:var(--blue); border:none; color:#fff; width:45px; height:45px; border-radius:50%; font-size:20px">➤</button>
</div>

<div id="profSheet" class="sheet-box" onclick="closeSheets()"><div class="sheet" onclick="event.stopPropagation()">
    <button class="btn" onclick="location.reload()">🔄 Səhifəni Yenilə</button>
    <button class="btn" onclick="hardReset()" style="color:#ff3b30">🛑 Hesabı Sıfırla</button>
    <button class="btn" onclick="closeSheets()">Bağla</button>
</div></div>

<div id="roomSheet" class="sheet-box" onclick="closeSheets()"><div class="sheet" onclick="event.stopPropagation()">
    <button class="btn" onclick="createRoom()" style="background:var(--blue)">➕ Yeni Otaq Yarat</button>
    <div id="roomList" style="max-height: 40vh; overflow-y: auto;"></div>
</div></div>

<script>
    const SB_URL = 'https://pyknspxnwnilhqsazidj.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5a25zcHhud25pbGhxc2F6aWRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcyODE0MzAsImV4cCI6MjA4Mjg1NzQzMH0.NlU2cVFug6PH6rZ4RM-344-tPnoYQVrOzWKXOn5y3eU';
    const sb = supabase.createClient(SB_URL, SB_KEY);

    let user = JSON.parse(localStorage.getItem('x_user'));
    let myRooms = JSON.parse(localStorage.getItem('x_rooms')) || [{ name: 'Qlobal Çat', isZ: false }];
    let curRoom = myRooms[0];
    let isGhost = false;
    let recorder; let chunks = [];

    if(!user) {
        let n = prompt("Ləqəbiniz:");
        user = { nick: n || 'Anonim', ava: `https://ui-avatars.com/api/?name=${n || 'A'}&background=random` };
        localStorage.setItem('x_user', JSON.stringify(user));
        location.reload();
    }

    async function checkServer() {
        const s = document.getElementById('srv');
        try {
            const { data, error } = await sb.from('messages').select('id').limit(1);
            if(error) throw error;
            s.innerText = "SERVER AKTİVDİR ✅"; s.className = "ok";
            setTimeout(() => s.style.display = 'none', 2000);
            return true;
        } catch (e) {
            s.innerText = "SERVERƏ QOŞULMA ALINMIR ❌ (Failed to fetch)";
            s.style.display = 'block'; s.className = "";
            return false;
        }
    }

    async function loadMsgs() {
        const { data, error } = await sb.from('messages').select('*').eq('group_id', curRoom.name).order('created_at', {ascending:true});
        if(error) return;
        const chat = document.getElementById('chat'); chat.innerHTML = '';
        data.forEach(m => {
            let j = {}; try { j = JSON.parse(m.content); } catch { j = {text: m.content}; }
            const isMe = m.nickname === user.nick;
            const div = document.createElement('div');
            div.className = `msg ${isMe ? 'me' : 'other'} ${j.isGhost ? 'ghost-msg' : ''}`;
            
            let html = j.type === 'voice' ? `<audio controls src="${j.url}" style="width:200px; height:35px"></audio>` : `<div>${j.text || ''}</div>`;
            div.innerHTML = `${!isMe ? `<span class="sender">${m.nickname}</span>` : ''} ${html}`;
            chat.appendChild(div);

            if(j.isGhost && isMe) setTimeout(() => sb.from('messages').delete().eq('id', m.id).then(() => loadMsgs()), 15000);
        });
        chat.scrollTop = chat.scrollHeight;
    }

    async function send(payload) {
        payload.isGhost = isGhost;
        if(isGhost) toggleGhost();
        const { error } = await sb.from('messages').insert([{ nickname: user.nick, group_id: curRoom.name, content: JSON.stringify(payload) }]);
        if(error) alert("Xəta: " + error.message);
        loadMsgs();
    }

    function sendText() {
        const i = document.getElementById('mInp'); if(!i.value) return;
        send({ text: i.value, type: 'text' }); i.value = '';
    }

    async function handleVoice() {
        const btn = document.getElementById('micBtn');
        if (!recorder || recorder.state === "inactive") {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            recorder = new MediaRecorder(stream);
            chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = async () => {
                btn.classList.remove('rec');
                const blob = new Blob(chunks, { type: 'audio/ogg' });
                const fileName = `v_${Date.now()}.ogg`;
                await sb.storage.from('audio_messages').upload(fileName, blob);
                const url = `${SB_URL}/storage/v1/object/public/audio_messages/${fileName}`;
                send({ type: 'voice', url: url });
            };
            recorder.start(); btn.classList.add('rec');
        } else { recorder.stop(); }
    }

    function toggleGhost() { isGhost = !isGhost; document.getElementById('gBtn').classList.toggle('active', isGhost); }

    function renderRooms() {
        const list = document.getElementById('roomList'); list.innerHTML = '';
        myRooms.forEach(r => {
            const b = document.createElement('button'); b.className = 'btn';
            b.innerHTML = `🏠 ${r.name} ${r.pass ? '🔒' : ''}`;
            b.onclick = () => {
                if(r.pass && prompt("Şifrə:") !== r.pass) return alert("Səhv!");
                curRoom = r; document.getElementById('curRoomName').innerText = r.name;
                closeSheets(); loadMsgs();
            };
            list.appendChild(b);
        });
        openSheet('roomSheet');
    }

    function createRoom() {
        const n = prompt("Otaq adı:"); if(!n) return;
        const p = prompt("Şifrə (istəmirsənsə boş qoy):") || null;
        const r = { name: n, pass: p };
        myRooms.push(r); localStorage.setItem('x_rooms', JSON.stringify(myRooms));
        curRoom = r; document.getElementById('curRoomName').innerText = n;
        closeSheets(); loadMsgs();
    }

    function openSheet(id) { document.getElementById(id).classList.add('active'); }
    function closeSheets() { document.querySelectorAll('.sheet-box').forEach(s => s.classList.remove('active')); }
    function hardReset() { localStorage.clear(); location.reload(); }

    document.getElementById('myAva').src = user.ava;
    checkServer().then(ok => { if(ok) loadMsgs(); });
    sb.channel('any').on('postgres_changes', {event:'*', schema:'public', table:'messages'}, () => loadMsgs()).subscribe();
</script>
</body>
</html>
