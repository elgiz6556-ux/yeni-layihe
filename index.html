<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>X-Chat PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b0d10; --card: #16191f; --blue: #007aff; --text: #ffffff; --ghost-bg: linear-gradient(45deg, #434343, #000000); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        /* HEADER */
        header { background: rgba(22, 25, 31, 0.95); backdrop-filter: blur(10px); padding: 45px 15px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 1000; }
        .top { display: flex; justify-content: space-between; align-items: center; }
        .u-box { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .u-box img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--blue); object-fit: cover; }
        .room-title { font-size: 16px; font-weight: bold; color: var(--blue); }

        /* CHAT AREA */
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 18px; font-size: 15px; position: relative; animation: pop 0.2s ease; line-height: 1.4; word-wrap: break-word; }
        .me { align-self: flex-end; background: var(--blue); border-bottom-right-radius: 4px; }
        .other { align-self: flex-start; background: #262629; border-bottom-left-radius: 4px; }
        .ghost { background: var(--ghost-bg) !important; border: 1px dashed #555; animation: evaporate 12s forwards; }
        .sender { font-size: 11px; font-weight: bold; opacity: 0.7; margin-bottom: 4px; display: block; }

        /* FOOTER */
        .footer { background: var(--card); padding: 10px 10px 35px; display: flex; align-items: center; gap: 8px; }
        .ghost-toggle { width: 38px; height: 38px; border-radius: 50%; border: 1px solid #444; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; font-size: 20px; }
        .ghost-toggle.active { background: #ff3b30; border-color: #ff3b30; box-shadow: 0 0 10px #ff3b30; }
        .input-wrap { flex: 1; background: #000; border-radius: 25px; padding: 0 15px; display: flex; align-items: center; border: 1px solid rgba(255,255,255,0.1); }
        #mInp { border: none; background: transparent; color: #fff; padding: 12px 0; width: 100%; outline: none; font-size: 16px; }
        .mic-btn { width: 42px; height: 42px; border-radius: 50%; background: #2c2c2e; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; }
        .mic-btn.recording { background: #ff3b30; animation: pulse 1s infinite; }

        /* MODALS */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; display: none; align-items: flex-end; }
        .overlay.active { display: flex; }
        .sheet { width: 100%; background: #1c1c1e; border-radius: 30px 30px 0 0; padding: 25px; transform: translateY(100%); transition: 0.3s; }
        .overlay.active .sheet { transform: translateY(0); }
        .btn { width: 100%; padding: 15px; background: #2c2c2e; border: none; color: #fff; border-radius: 15px; margin-bottom: 10px; font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 10px; }

        @keyframes evaporate { 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-20px); pointer-events: none; } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        @keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <div class="top">
            <div class="u-box" onclick="openSheet('profSheet')">
                <img id="myAva" src="">
                <div><span class="room-title" id="roomNameDisplay">Qlobal Çat</span><div style="font-size:10px; color:#34c759">● Online</div></div>
            </div>
            <div style="font-size: 24px; cursor: pointer; display: flex; gap: 15px;">
                <span onclick="openFriends()">👥</span>
                <span onclick="renderRooms()">🏠</span>
            </div>
        </div>
    </header>

    <div id="chat"></div>

    <div class="footer">
        <div class="ghost-toggle" id="gBtn" onclick="toggleGhost()">👻</div>
        <div class="input-wrap"><input type="text" id="mInp" placeholder="Mesaj..." onkeypress="if(event.key==='Enter') sendText()"></div>
        <div class="mic-btn" id="micBtn" onclick="handleVoice()">🎤</div>
        <button onclick="sendText()" style="background:var(--blue); border:none; color:#fff; width:42px; height:42px; border-radius:50%; font-size:18px">➤</button>
    </div>

    <div id="profSheet" class="overlay" onclick="closeSheets()"><div class="sheet" onclick="event.stopPropagation()">
        <h3>Profil Ayarları</h3>
        <button class="btn" onclick="document.getElementById('fileAva').click()">🖼 Şəkli Dəyiş</button>
        <input type="file" id="fileAva" hidden accept="image/*" onchange="uploadAva()">
        <button class="btn" onclick="logout()" style="color:#ff3b30">🛑 Hesabdan Çıx və Sıfırla</button>
    </div></div>

    <div id="roomSheet" class="overlay" onclick="closeSheets()"><div class="sheet" onclick="event.stopPropagation()">
        <h3>Otaqlar</h3>
        <button class="btn" onclick="createRoom()" style="background:var(--blue)">➕ Yeni Otaq Yarat</button>
        <div id="roomList" style="max-height: 40vh; overflow-y: auto;"></div>
    </div></div>

<script>
    const SB_URL = 'https://pyknspxnwnilhqsazidj.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5a25zcHhud25pbGhxc2F6aWRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcyODE0MzAsImV4cCI6MjA4Mjg1NzQzMH0.NlU2cVFug6PH6rZ4RM-344-tPnoYQVrOzWKXOn5y3eU';
    const sb = supabase.createClient(SB_URL, SB_KEY);

    let user = JSON.parse(localStorage.getItem('x_user'));
    let myRooms = JSON.parse(localStorage.getItem('x_rooms')) || [{ name: 'Qlobal Çat', isZ: false }];
    let curRoom = myRooms[0];
    let isGhost = false;
    let mediaRecorder;
    let audioChunks = [];

    if(!user) {
        let n = prompt("Ləqəbiniz:");
        user = { nick: n || 'Anonim', ava: `https://ui-avatars.com/api/?name=${n}&background=random` };
        localStorage.setItem('x_user', JSON.stringify(user));
        location.reload();
    }

    function init() {
        document.getElementById('myAva').src = user.ava;
        loadMsgs();
        sb.channel('db').on('postgres_changes', {event:'*', schema:'public', table:'messages'}, (p) => {
            if(p.new.group_id === curRoom.name) loadMsgs();
        }).subscribe();
    }

    // --- MESAJ SİSTEMİ ---
    async function loadMsgs() {
        const { data } = await sb.from('messages').select('*').eq('group_id', curRoom.name).order('created_at', {ascending:true});
        const chat = document.getElementById('chat'); chat.innerHTML = '';
        data.forEach(m => {
            let j = {}; try { j = JSON.parse(m.content); } catch { j = {text: m.content}; }
            const isMe = m.nickname === user.nick;
            const div = document.createElement('div');
            div.className = `msg ${isMe ? 'me' : 'other'} ${j.isGhost ? 'ghost' : ''}`;
            
            let html = j.type === 'voice' ? `<audio controls src="${j.url}" style="width:200px"></audio>` : 
                       (j.type === 'loc' ? `<a href="${j.url}" target="_blank" style="color:cyan">📍 Məkan</a>` : `<div>${j.text || ''}</div>`);
            
            div.innerHTML = `${!isMe ? `<span class="sender">${m.nickname}</span>` : ''} ${html}`;
            chat.appendChild(div);

            if(j.isGhost && isMe) setTimeout(() => sb.from('messages').delete().eq('id', m.id), 10000);
        });
        chat.scrollTop = chat.scrollHeight;
    }

    async function send(payload) {
        payload.isGhost = isGhost;
        if(isGhost) toggleGhost();
        await sb.from('messages').insert([{ nickname: user.nick, group_id: curRoom.name, content: JSON.stringify(payload) }]);
    }

    function sendText() {
        const inp = document.getElementById('mInp');
        if(!inp.value) return;
        send({ text: inp.value, type: 'text' });
        inp.value = '';
    }

    // --- SƏS YAZMA SİSTEMİ ---
    async function handleVoice() {
        const btn = document.getElementById('micBtn');
        if (!mediaRecorder || mediaRecorder.state === "inactive") {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                btn.classList.remove('recording');
                const blob = new Blob(audioChunks, { type: 'audio/ogg' });
                const name = `v_${Date.now()}.ogg`;
                await sb.storage.from('audio_messages').upload(name, blob);
                const url = `${SB_URL}/storage/v1/object/public/audio_messages/${name}`;
                send({ type: 'voice', url: url });
            };
            mediaRecorder.start();
            btn.classList.add('recording');
        } else {
            mediaRecorder.stop();
        }
    }

    // --- OTAQ VƏ GİZLİLİK ---
    function toggleGhost() { isGhost = !isGhost; document.getElementById('gBtn').classList.toggle('active', isGhost); }

    function createRoom() {
        const n = prompt("Otaq adı:"); if(!n) return;
        const isZ = confirm("Məkan kilidi olsun?");
        const p = prompt("Şifrə (opsional):") || null;
        let r = { name: n, isZ: isZ, pass: p };
        if(isZ) {
            navigator.geolocation.getCurrentPosition(pos => {
                r.lat = pos.coords.latitude; r.lng = pos.coords.longitude;
                myRooms.push(r); saveRooms(); join(r);
            });
        } else { myRooms.push(r); saveRooms(); join(r); }
    }

    function renderRooms() {
        const list = document.getElementById('roomList'); list.innerHTML = '';
        myRooms.forEach(r => {
            const b = document.createElement('button');
            b.className = 'btn';
            b.innerHTML = `🏠 ${r.name} ${r.isZ ? '📍' : ''} ${r.pass ? '🔒' : ''}`;
            b.onclick = () => {
                if(r.pass && prompt("Şifrə:") !== r.pass) return alert("Səhv!");
                if(r.isZ) {
                    navigator.geolocation.getCurrentPosition(p => {
                        if(getDist(p.coords.latitude, p.coords.longitude, r.lat, r.lng) > 0.2) return alert("Uzaqsınız!");
                        join(r);
                    });
                } else join(r);
            };
            list.appendChild(b);
        });
        openSheet('roomSheet');
    }

    function join(r) { curRoom = r; document.getElementById('roomNameDisplay').innerText = r.name; closeSheets(); loadMsgs(); }
    function getDist(la1, lo1, la2, lo2) {
        const R = 6371; const dLat = (la2-la1)*Math.PI/180; const dLon = (lo2-lo1)*Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    
    function openFriends() { /* DM sistemi viewUser vasitəsilə işləyir */ alert("Dostunu tapmaq üçün mesajına toxun və DM aç!"); }
    function saveRooms() { localStorage.setItem('x_rooms', JSON.stringify(myRooms)); }
    function openSheet(id) { document.getElementById(id).classList.add('active'); }
    function closeSheets() { document.querySelectorAll('.overlay').forEach(o => o.classList.remove('active')); }
    function logout() { localStorage.clear(); location.reload(); }

    init();
</script>
</body>
</html>
