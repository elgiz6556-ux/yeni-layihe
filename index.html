<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X-Chat TITAN | Premium</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --p: #0a84ff; 
            --bg: #000000; 
            --card: rgba(28, 28, 30, 0.75);
            --border: rgba(255, 255, 255, 0.15);
            --text: #ffffff;
            --glass: blur(15px);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { 
            background: var(--bg); color: var(--text); 
            font-family: -apple-system, system-ui, sans-serif;
            height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
            background-image: radial-gradient(circle at top right, #111122, #000000);
        }

        header { 
            padding: 50px 20px 15px; background: rgba(0,0,0,0.65); 
            backdrop-filter: var(--glass); border-bottom: 1px solid var(--border); 
            display: flex; justify-content: space-between; align-items: center; z-index: 10;
        }

        #chat { 
            flex: 1; overflow-y: auto; padding: 20px; 
            display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth;
        }

        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(12px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .msg { 
            max-width: 80%; padding: 12px 16px; border-radius: 20px; font-size: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); animation: slideUp 0.3s ease-out forwards;
            word-wrap: break-word; line-height: 1.4;
        }
        .msg.me { align-self: flex-end; background: var(--p); border-bottom-right-radius: 4px; }
        .msg.other { align-self: flex-start; background: var(--card); backdrop-filter: var(--glass); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

        .sender-name { font-size: 11px; opacity: 0.6; margin-bottom: 4px; font-weight: 500; }

        #typingArea { 
            padding: 0 25px; font-size: 12px; color: var(--p); 
            height: 20px; opacity: 0; transition: opacity 0.3s; font-weight: 500;
        }

        .footer { 
            padding: 12px 15px 35px; background: rgba(0,0,0,0.85); 
            backdrop-filter: var(--glass); border-top: 1px solid var(--border); 
            display: flex; gap: 10px; align-items: center;
        }

        .inp-box { 
            flex: 1; background: rgba(255,255,255,0.08); border-radius: 24px; 
            padding: 0 16px; border: 1px solid var(--border); display: flex; align-items: center;
        }
        input { 
            background: transparent; border: none; color: #fff; flex: 1; 
            padding: 14px 0; font-size: 16px; outline: none; 
        }

        .send-btn { 
            background: var(--p); border: none; width: 46px; height: 46px; 
            border-radius: 50%; color: white; cursor: pointer; display: flex; 
            align-items: center; justify-content: center; font-size: 18px;
        }
        .send-btn:active { transform: scale(0.92); }
    </style>
</head>
<body>

<header>
    <div>
        <b id="userNick" style="font-size: 18px;">Yüklənir...</b>
        <div style="font-size: 11px; color: #32d74b; margin-top: 2px;" id="onlineCount">● Bağlanılır...</div>
    </div>
</header>

<div id="chat"></div>
<div id="typingArea" id="typ"></div>

<div class="footer">
    <div class="inp-box">
        <input type="text" id="mInp" placeholder="Mesaj yazın..." autocomplete="off" oninput="sendTyping()" onkeypress="if(event.key==='Enter') handleSend()">
    </div>
    <button class="send-btn" onclick="handleSend()">➤</button>
</div>

<script>
    const SB_URL = 'https://pyknspxnwnilhqsazidj.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5a25zcHhud25pbGhxc2F6aWRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcyODE0MzAsImV4cCI6MjA4Mjg1NzQzMH0.NlU2cVFug6PH6rZ4RM-344-tPnoYQVrOzWKXOn5y3eU'; 
    const sb = supabase.createClient(SB_URL, SB_KEY);

    let user = JSON.parse(localStorage.getItem('x_user'));
    let curRoom = 'Qlobal';
    let typingTimer;

    if(!user) {
        let n = prompt("Söhbətə qatılmaq üçün ləqəb yazın:");
        user = { nick: n && n.trim() !== "" ? n.trim() : "User_" + Math.floor(Math.random()*9999) };
        localStorage.setItem('x_user', JSON.stringify(user));
    }
    document.getElementById('userNick').innerText = user.nick;

    // Təhlükəsiz Unicode Şifrələmə
    const encodeMsg = (str) => {
        try { return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (m, p1) => String.fromCharCode('0x' + p1))); } 
        catch (e) { return str; }
    };
    const decodeMsg = (str) => {
        try { return decodeURIComponent(atob(str).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')); } 
        catch (e) { return str; }
    };

    const chatBox = document.getElementById('chat');

    // Mesajları gətirmək
    async function loadMessages() {
        try {
            const { data, error } = await sb.from('messages').select('*').eq('group_id', curRoom).order('created_at', { ascending: true });
            if (error) throw error;

            chatBox.innerHTML = '';
            data?.forEach(m => {
                const isMe = m.nickname === user.nick;
                chatBox.innerHTML += `
                    <div class="msg ${isMe ? 'me' : 'other'}">
                        ${!isMe ? `<div class="sender-name">${m.nickname}</div>` : ''}
                        <div>${decodeMsg(m.content)}</div>
                    </div>`;
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        } catch (err) {
            console.error("Yükləmə xətası:", err.message);
        }
    }

    // Mesaj Göndərmək
    async function handleSend() {
        const inp = document.getElementById('mInp');
        const text = inp.value.trim();
        if(!text) return;

        inp.value = ''; // Ekranda dərhal təmizlə
        
        try {
            const { error } = await sb.from('messages').insert([{
                nickname: user.nick,
                content: encodeMsg(text),
                group_id: curRoom,
                is_dm: false
            }]);
            
            if(error) throw error;
        } catch (err) {
            alert("Sistem xətası və ya Baza icazəsi yoxdur. Mesaj getmədi.");
            console.error("Göndərmə xətası:", err);
        }
    }

    // Real-time Kanalları (Typing & Presence & Database)
    try {
        const channel = sb.channel('chat-room', {
            config: { broadcast: { self: false }, presence: { key: user.nick } }
        });

        // Typing indikatoru
        window.sendTyping = () => channel.send({ type: 'broadcast', event: 'typing', payload: { nick: user.nick } });
        
        channel.on('broadcast', { event: 'typing' }, (payload) => {
            const area = document.getElementById('typingArea');
            area.innerText = `${payload.payload.nick} yazır...`;
            area.style.opacity = 1;
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => { area.style.opacity = 0; }, 2000);
        });

        // Onlayn sayı
        channel.on('presence', { event: 'sync' }, () => {
            const count = Object.keys(channel.presenceState()).length;
            document.getElementById('onlineCount').innerText = `● ${count} Onlayn`;
        }).subscribe(async (status) => {
            if (status === 'SUBSCRIBED') await channel.track({ online_at: new Date().toISOString() });
        });

        // Yeni mesaj gələndə anında ekrana sal
        sb.channel('db-changes').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, loadMessages).subscribe();
    } catch(e) { console.error("Realtime qurula bilmədi:", e); }

    loadMessages();
</script>
</body>
</html>
