<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>X-Chat TITAN | 100% Stabil</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --p: #007aff; 
            --bg: #010101; 
            --card: rgba(28, 28, 30, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --glass: blur(20px);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background: var(--bg); color: var(--text); 
            font-family: -apple-system, system-ui, sans-serif;
            height: 100dvh; display: flex; flex-direction: column; overflow: hidden; margin: 0;
            background-image: radial-gradient(circle at top right, #1a1a2e, #010101);
        }

        header { 
            padding: 50px 20px 15px; background: rgba(0,0,0,0.6); 
            backdrop-filter: var(--glass); border-bottom: 1px solid var(--border); 
            display: flex; justify-content: space-between; align-items: center; z-index: 10;
        }

        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(8px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .msg { 
            max-width: 78%; padding: 12px 16px; border-radius: 22px; font-size: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); position: relative;
            animation: fadeIn 0.3s ease-out forwards;
        }
        .msg.me { align-self: flex-end; background: linear-gradient(135deg, var(--p), #005bb5); border-bottom-right-radius: 4px; }
        .msg.other { align-self: flex-start; background: var(--card); backdrop-filter: var(--glass); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

        #typingArea { 
            padding: 5px 25px; font-size: 11px; color: var(--p); 
            height: 20px; font-style: italic; opacity: 0; transition: 0.3s;
        }

        .footer { 
            padding: 10px 15px 35px; background: rgba(0,0,0,0.8); 
            backdrop-filter: var(--glass); border-top: 1px solid var(--border); 
            display: flex; gap: 10px; align-items: center;
        }

        .inp-box { 
            flex: 1; background: rgba(255,255,255,0.05); border-radius: 25px; 
            padding: 0 18px; border: 1px solid var(--border); display: flex;
        }
        input { background: transparent; border: none; color: #fff; flex: 1; padding: 12px 0; font-size: 16px; outline: none; }

        .send-btn { 
            background: var(--p); border: none; width: 44px; height: 44px; 
            border-radius: 50%; color: white; cursor: pointer; display: flex; 
            align-items: center; justify-content: center; transition: 0.3s;
        }
        .send-btn:active { transform: scale(0.9); }
    </style>
</head>
<body>

<header>
    <div>
        <b id="userNick">Yüklənir...</b>
        <div style="font-size: 10px; color: #34c759" id="onlineCount">● 1 Onlayn</div>
    </div>
    <div style="display: flex; gap: 20px;">
        <span onclick="location.reload()" style="cursor:pointer; font-size: 18px;">🔄 Yenilə</span>
    </div>
</header>

<div id="chat"></div>
<div id="typingArea"></div>

<div class="footer">
    <div class="inp-box">
        <input type="text" id="mInp" placeholder="Mesaj yazın..." oninput="sendTyping()" onkeypress="if(event.key==='Enter') handleSend()">
    </div>
    <button class="send-btn" onclick="handleSend()">➤</button>
</div>

<script>
    // Real bazanın açarları bərpa olundu!
    const SB_URL = 'https://pyknspxnwnilhqsazidj.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5a25zcHhud25pbGhxc2F6aWRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcyODE0MzAsImV4cCI6MjA4Mjg1NzQzMH0.NlU2cVFug6PH6rZ4RM-344-tPnoYQVrOzWKXOn5y3eU'; 
    const sb = supabase.createClient(SB_URL, SB_KEY);

    let user = JSON.parse(localStorage.getItem('x_user'));
    let curRoom = 'Qlobal';
    let typingTimer;

    if(!user) {
        let n = prompt("Ləqəbiniz:");
        user = { nick: n ? n.trim() : "User" + Math.floor(Math.random()*999) };
        localStorage.setItem('x_user', JSON.stringify(user));
        location.reload();
    }
    document.getElementById('userNick').innerText = user.nick;

    // --- AZƏRBAYCAN HƏRFLƏRİNƏ UYĞUN TƏHLÜKƏSİZ ŞİFRƏLƏMƏ ---
    function encodeMsg(str) {
        try {
            return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (match, p1) => {
                return String.fromCharCode('0x' + p1);
            }));
        } catch (e) {
            return str; // Xəta baş versə, dondurma, sadə mətn kimi göndər
        }
    }

    function decodeMsg(str) {
        try {
            return decodeURIComponent(atob(str).split('').map(c => {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
        } catch (e) {
            return str; // Şifrəli deyilsə olduğu kimi göstər
        }
    }

    // --- TYPING INDICATOR & PRESENCE ---
    const channel = sb.channel('chat-room', {
        config: { broadcast: { self: false }, presence: { key: user.nick } }
    });

    function sendTyping() {
        channel.send({
            type: 'broadcast',
            event: 'typing',
            payload: { nick: user.nick }
        });
    }

    channel.on('broadcast', { event: 'typing' }, (payload) => {
        const area = document.getElementById('typingArea');
        area.innerText = `${payload.payload.nick} yazır...`;
        area.style.opacity = 1;
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => { area.style.opacity = 0; }, 2000);
    }).subscribe();

    channel.on('presence', { event: 'sync' }, () => {
        const state = channel.presenceState();
        const count = Object.keys(state).length;
        document.getElementById('onlineCount').innerText = `● ${count} Onlayn`;
    }).subscribe(async (status) => {
        if (status === 'SUBSCRIBED') {
            await channel.track({ online_at: new Date().toISOString() });
        }
    });

    // --- MESAJLARIN YÜKLƏNMƏSİ VƏ GÖNDƏRİLMƏSİ ---
    async function loadMessages() {
        const { data, error } = await sb.from('messages')
            .select('*')
            .eq('group_id', curRoom)
            .order('created_at', { ascending: true });
        
        if (error) {
            console.error("Yükləmə xətası:", error);
            return;
        }

        const box = document.getElementById('chat');
        box.innerHTML = '';
        data?.forEach(m => {
            const isMe = m.nickname === user.nick;
            const content = decodeMsg(m.content); // Təhlükəsiz de-kodlaşdırma

            box.innerHTML += `
                <div class="msg ${isMe ? 'me' : 'other'}">
                    <div style="font-size: 10px; opacity: 0.6; margin-bottom: 4px;">${m.nickname}</div>
                    <div>${content}</div>
                </div>`;
        });
        box.scrollTop = box.scrollHeight;
    }

    async function handleSend() {
        const inp = document.getElementById('mInp');
        const text = inp.value.trim();
        if(!text) return;

        const encodedContent = encodeMsg(text); // Təhlükəsiz kodlaşdırma

        const payload = {
            nickname: user.nick,
            content: encodedContent,
            group_id: curRoom,
            is_dm: false
        };

        inp.value = '';
        
        const { error } = await sb.from('messages').insert([payload]);
        if(error) {
            alert("Göndərmə xətası: " + error.message);
        } else {
            loadMessages();
        }
    }

    // Real-time yenilənmə (Yeni mesaj gələn kimi ekrana sal)
    sb.channel('db-changes').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, loadMessages).subscribe();

    // Səhifə açılanda mesajları gətir
    loadMessages();
</script>
</body>
</html>
