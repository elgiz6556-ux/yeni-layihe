<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>X-Chat ULTIMATE</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b0d10; --panel: #16191f; --blue: #3b82f6; --me: #2b5278; --other: #1c2128; --text: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        header { background: var(--panel); padding: 45px 15px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; }
        .u-info { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .u-info img { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--blue); object-fit: cover; }

        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .msg-box { max-width: 85%; padding: 10px 14px; border-radius: 18px; font-size: 15px; animation: pop 0.2s ease; word-wrap: break-word; }
        .me { align-self: flex-end; background: var(--me); border-bottom-right-radius: 4px; }
        .other { align-self: flex-start; background: var(--other); border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }

        .footer { background: var(--panel); padding: 10px 10px 35px; display: flex; align-items: center; gap: 10px; }
        .inp-wrap { flex: 1; background: #000; border-radius: 25px; padding: 0 15px; display: flex; align-items: center; border: 1px solid rgba(255,255,255,0.1); }
        #mInp { border: none; background: transparent; color: #fff; padding: 12px 0; flex: 1; outline: none; }

        .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; display: none; align-items: flex-end; backdrop-filter: blur(8px); }
        .sheet-overlay.active { display: flex; }
        .sheet { width: 100%; background: var(--panel); border-radius: 30px 30px 0 0; padding: 25px; transform: translateY(100%); transition: 0.3s; max-height: 85vh; overflow-y: auto; }
        .sheet-overlay.active .sheet { transform: translateY(0); }
        
        .sheet-btn { width: 100%; padding: 16px; background: rgba(255,255,255,0.05); border: none; color: #fff; border-radius: 15px; margin-bottom: 10px; text-align: left; display: flex; align-items: center; gap: 12px; font-size: 15px; }
        .edit-inp { width: 100%; background: #000; border: 1px solid var(--blue); color: #fff; padding: 12px; border-radius: 12px; margin-bottom: 15px; outline: none; }

        @keyframes pop { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header>
        <div class="top-bar">
            <div class="u-info" onclick="openSheet('profileSheet')">
                <img id="headAva" src="">
                <div><b id="roomTitle">Qlobal Çat</b><div style="font-size:10px; color:#10b981">● Aktiv</div></div>
            </div>
            <div style="font-size:24px; cursor: pointer" onclick="renderRooms()">🏠</div>
        </div>
    </header>

    <div id="chat"></div>

    <div class="footer">
        <span onclick="openSheet('attachSheet')" style="font-size:25px; color:var(--blue); cursor:pointer">+</span>
        <div class="inp-wrap"><input type="text" id="mInp" placeholder="Mesaj yaz..." onkeypress="if(event.key==='Enter') sendMsg()"></div>
        <button onclick="sendMsg()" style="background:var(--blue); border:none; color:#fff; width:42px; height:42px; border-radius:50%; cursor:pointer">➤</button>
    </div>

    <div id="profileSheet" class="sheet-overlay" onclick="closeSheets()"><div class="sheet" onclick="event.stopPropagation()">
        <h3 style="margin-bottom:20px">Profil Ayarları</h3>
        <div style="text-align:center; margin-bottom:20px">
            <img id="editAvaPrev" style="width:90px; height:90px; border-radius:50%; border:3px solid var(--blue); object-fit:cover; margin-bottom:10px">
            <button onclick="document.getElementById('fileAva').click()" style="display:block; margin:auto; background:none; border:none; color:var(--blue); font-size:14px">Şəkli Dəyiş</button>
            <input type="file" id="fileAva" hidden accept="image/*" onchange="uploadProfileImg()">
        </div>
        <label style="font-size:12px; color:gray">Ləqəbiniz:</label>
        <input type="text" id="editNick" class="edit-inp">
        <label style="font-size:12px; color:gray">Yeni Şifrə (opsional):</label>
        <input type="password" id="editPass" class="edit-inp" placeholder="Şifrəni dəyişmək üçün yazın">
        <button class="sheet-btn" onclick="saveProfile()" style="background:var(--blue); justify-content:center; font-weight:bold">Yadda Saxla</button>
        <button class="sheet-btn" onclick="logout()" style="color:#ff4444; justify-content:center; margin-top:10px">Çıxış Et</button>
    </div></div>

    <div id="roomsSheet" class="sheet-overlay" onclick="closeSheets()"><div class="sheet" onclick="event.stopPropagation()">
        <h3 style="margin-bottom:20px">Otaqlar</h3>
        <button class="sheet-btn" onclick="createRoomUI()" style="background:var(--blue); font-weight:bold">➕ Yeni Otaq (Məkan/Şifrə)</button>
        <div id="roomsList"></div>
    </div></div>

    <div id="attachSheet" class="sheet-overlay" onclick="closeSheets()"><div class="sheet">
        <button class="sheet-btn" onclick="sendLocation()">📍 Məkanımı Göndər</button>
        <button class="sheet-btn" onclick="document.getElementById('imgInp').click()">🖼 Şəkil Göndər</button>
        <input type="file" id="imgInp" hidden onchange="uploadMsgImg()">
    </div></div>

<script>
    const SB_URL = 'https://pyknspxnwnilhqsazidj.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5a25zcHhud25pbGhxc2F6aWRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcyODE0MzAsImV4cCI6MjA4Mjg1NzQzMH0.NlU2cVFug6PH6rZ4RM-344-tPnoYQVrOzWKXOn5y3eU';
    const sb = supabase.createClient(SB_URL, SB_KEY);

    let user = JSON.parse(localStorage.getItem('x_user'));
    let currentRoom = { name: 'General' };
    let myRooms = JSON.parse(localStorage.getItem('x_rooms')) || [{ name: 'General' }];

    if(!user) {
        const n = prompt("X-Chat-a xoş gəldiniz! Ləqəbiniz:");
        user = { nick: n || 'Anonim', ava: `https://ui-avatars.com/api/?name=${n}&background=random`, pass: '123' };
        localStorage.setItem('x_user', JSON.stringify(user));
        location.reload();
    }

    function init() {
        document.getElementById('headAva').src = user.ava;
        document.getElementById('editAvaPrev').src = user.ava;
        document.getElementById('editNick').value = user.nick;
        loadMsgs();
        sb.channel('global').on('postgres_changes', {event:'*', schema:'public', table:'messages'}, () => loadMsgs()).subscribe();
    }

    async function loadMsgs() {
        const { data } = await sb.from('messages').select('*').eq('group_id', currentRoom.name).order('created_at', {ascending:true});
        const chat = document.getElementById('chat'); chat.innerHTML = '';
        data.forEach(m => {
            let j = {}; try { j = JSON.parse(m.content); } catch { j = {text: m.content}; }
            const isMe = m.nickname === user.nick;
            const div = document.createElement('div');
            div.className = `msg-box ${isMe ? 'me' : 'other'}`;
            let contentHtml = j.type === 'loc' ? `<a href="${j.url}" target="_blank" style="color:#00e5ff">📍 Məkan paylaşıldı</a>` : 
                             (j.type === 'img' ? `<img src="${j.url}" style="max-width:100%; border-radius:10px; margin-top:5px">` : `<div>${j.text || ''}</div>`);
            div.innerHTML = `${!isMe ? `<b style="font-size:11px; color:var(--blue)">${m.nickname}</b><br>` : ''}${contentHtml}`;
            chat.appendChild(div);
        });
        chat.scrollTop = chat.scrollHeight;
    }

    async function sendMsg(extra = {}) {
        const inp = document.getElementById('mInp');
        if(!inp.value && !extra.type) return;
        const payload = { text: inp.value, ...extra };
        inp.value = '';
        await sb.from('messages').insert([{ nickname: user.nick, group_id: currentRoom.name, content: JSON.stringify(payload) }]);
    }

    // --- PROFİL SİSTEMİ ---
    async function uploadProfileImg() {
        const file = document.getElementById('fileAva').files[0];
        const name = `ava_${Date.now()}.png`;
        await sb.storage.from('audio_messages').upload(name, file);
        const url = `${SB_URL}/storage/v1/object/public/audio_messages/${name}`;
        user.ava = url;
        document.getElementById('editAvaPrev').src = url;
    }

    function saveProfile() {
        user.nick = document.getElementById('editNick').value;
        const newPass = document.getElementById('editPass').value;
        if(newPass) user.pass = newPass;
        localStorage.setItem('x_user', JSON.stringify(user));
        alert("Profil yeniləndi!");
        location.reload();
    }

    // --- OTAQ SİSTEMİ ---
    function createRoomUI() {
        const n = prompt("Otaq adı:"); if(!n) return;
        const isZ = confirm("Məkan kilidi aktiv olsun? (200m radius)");
        const p = prompt("Şifrə təyin edin (Boş qoymaq olar):");

        if(isZ) {
            navigator.geolocation.getCurrentPosition(pos => {
                const r = { name: n, lat: pos.coords.latitude, lng: pos.coords.longitude, isZone: true, pass: p || null };
                myRooms.push(r); saveRooms(); enterRoom(r);
            }, () => alert("GPS icazəsi lazımdır!"));
        } else {
            const r = { name: n, isZone: false, pass: p || null };
            myRooms.push(r); saveRooms(); enterRoom(r);
        }
    }

    function renderRooms() {
        const list = document.getElementById('roomsList'); list.innerHTML = '';
        myRooms.forEach(r => {
            const btn = document.createElement('button');
            btn.className = 'sheet-btn';
            btn.innerHTML = `🏠 ${r.name} ${r.isZone ? '📍' : ''} ${r.pass ? '🔒' : ''}`;
            btn.onclick = () => {
                if(r.pass && prompt("Şifrə daxil edin:") !== r.pass) return alert("Səhv şifrə!");
                if(r.isZone) {
                    navigator.geolocation.getCurrentPosition(pos => {
                        const dist = getDist(pos.coords.latitude, pos.coords.longitude, r.lat, r.lng);
                        if(dist > 0.2) return alert("Çox uzaqdasınız!");
                        enterRoom(r);
                    });
                } else { enterRoom(r); }
            };
            list.appendChild(btn);
        });
        openSheet('roomsSheet');
    }

    function enterRoom(r) { currentRoom = r; document.getElementById('roomTitle').innerText = r.name; closeSheets(); loadMsgs(); }
    function saveRooms() { localStorage.setItem('x_rooms', JSON.stringify(myRooms)); }

    // --- KÖMƏKÇİ FUNKSİYALAR ---
    function getDist(la1, lo1, la2, lo2) {
        const R = 6371; const dLat = (la2-la1)*Math.PI/180; const dLon = (lo2-lo1)*Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    function openSheet(id) { document.getElementById(id).classList.add('active'); }
    function closeSheets() { document.querySelectorAll('.sheet-overlay').forEach(s => s.classList.remove('active')); }
    function logout() { localStorage.clear(); location.reload(); }
    
    init();
</script>
</body>
</html>
