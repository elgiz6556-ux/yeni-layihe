<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>X-Chat FINAL MASTER</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b0d10; --card: #16191f; --blue: #007aff; --text: #ffffff; --me: #007aff; --other: #262629; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        header { background: rgba(22, 25, 31, 0.9); backdrop-filter: blur(10px); padding: 45px 15px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 100; }
        .top { display: flex; justify-content: space-between; align-items: center; }
        .u-box { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .u-box img { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--blue); object-fit: cover; }
        
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 15px; position: relative; animation: pop 0.2s ease; }
        .me { align-self: flex-end; background: var(--me); border-bottom-right-radius: 4px; }
        .other { align-self: flex-start; background: var(--other); border-bottom-left-radius: 4px; }
        .sender { font-size: 11px; font-weight: bold; color: var(--blue); margin-bottom: 4px; display: block; }

        .footer { background: var(--card); padding: 10px 15px 35px; display: flex; align-items: center; gap: 12px; }
        .input-area { flex: 1; background: #000; border-radius: 25px; padding: 0 15px; border: 1px solid rgba(255,255,255,0.1); }
        #mInp { border: none; background: transparent; color: #fff; padding: 12px 0; width: 100%; outline: none; font-size: 16px; }

        .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; display: none; align-items: flex-end; }
        .sheet-overlay.active { display: flex; }
        .sheet { width: 100%; background: #1c1c1e; border-radius: 30px 30px 0 0; padding: 30px; transform: translateY(100%); transition: 0.3s; }
        .sheet-overlay.active .sheet { transform: translateY(0); }
        .btn { width: 100%; padding: 16px; background: #2c2c2e; border: none; color: #fff; border-radius: 15px; margin-bottom: 12px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        @keyframes pop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <header>
        <div class="top">
            <div class="u-box" onclick="openSheet('profSheet')">
                <img id="myAva" src="">
                <div><b id="activeRoomName">Qlobal Çat</b><div style="font-size:10px; color:#34c759">● Online</div></div>
            </div>
            <div style="font-size: 26px; cursor: pointer" onclick="renderRooms()">🏠</div>
        </div>
    </header>

    <div id="chat"></div>

    <div class="footer">
        <span onclick="openSheet('toolSheet')" style="font-size:28px; color:var(--blue); cursor: pointer;">+</span>
        <div class="input-area"><input type="text" id="mInp" placeholder="Mesaj..." onkeypress="if(event.key==='Enter') send()"></div>
        <button onclick="send()" style="background:var(--blue); border:none; color:#fff; width:42px; height:42px; border-radius:50%">➤</button>
    </div>

    <div id="profSheet" class="sheet-overlay" onclick="closeSheets()"><div class="sheet" onclick="event.stopPropagation()">
        <h3 style="margin-bottom:20px">Profil Ayarları</h3>
        <button class="btn" onclick="hardReset()" style="color:#ff453a">🛑 Çıxış və Yaddaşı Təmizlə</button>
        <button class="btn" onclick="closeSheets()">Bağla</button>
    </div></div>

    <div id="roomSheet" class="sheet-overlay" onclick="closeSheets()"><div class="sheet" onclick="event.stopPropagation()">
        <h3 style="margin-bottom:20px">Otaqlar</h3>
        <button class="btn" onclick="createNewRoom()" style="background:var(--blue); font-weight:bold">➕ Yeni Otaq Yarat</button>
        <div id="roomList" style="max-height: 40vh; overflow-y: auto;"></div>
    </div></div>

    <div id="toolSheet" class="sheet-overlay" onclick="closeSheets()"><div class="sheet">
        <button class="btn" onclick="sendLoc()">📍 Məkan Paylaş</button>
        <button class="btn" onclick="closeSheets()">Ləğv Et</button>
    </div></div>

<script>
    const SB_URL = 'https://pyknspxnwnilhqsazidj.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5a25zcHhud25pbGhxc2F6aWRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcyODE0MzAsImV4cCI6MjA4Mjg1NzQzMH0.NlU2cVFug6PH6rZ4RM-344-tPnoYQVrOzWKXOn5y3eU';
    const sb = supabase.createClient(SB_URL, SB_KEY);

    let user = JSON.parse(localStorage.getItem('x_user'));
    let myRooms = JSON.parse(localStorage.getItem('x_rooms')) || [{ name: 'Qlobal Çat', isZone: false, pass: null }];
    let currentRoom = myRooms[0];

    if(!user) {
        let n = prompt("Ləqəbiniz:");
        user = { nick: n || 'Anonim', ava: `https://ui-avatars.com/api/?name=${n || 'A'}&background=random` };
        localStorage.setItem('x_user', JSON.stringify(user));
        location.reload();
    }

    function init() {
        document.getElementById('myAva').src = user.ava;
        loadMsgs();
        // Real-time dinləyici
        sb.channel('any').on('postgres_changes', {event:'*', schema:'public', table:'messages'}, (p) => {
            if(p.new.group_id === currentRoom.name) loadMsgs();
        }).subscribe();
    }

    async function loadMsgs() {
        const { data } = await sb.from('messages').select('*').eq('group_id', currentRoom.name).order('created_at', {ascending:true});
        const box = document.getElementById('chat'); box.innerHTML = '';
        data.forEach(m => {
            let body = {}; try { body = JSON.parse(m.content); } catch { body = {text: m.content}; }
            const isMe = m.nickname === user.nick;
            const div = document.createElement('div');
            div.className = `msg ${isMe ? 'me' : 'other'}`;
            let content = body.type === 'loc' ? `<a href="${body.url}" target="_blank" style="color:#00e5ff">📍 Məkan paylaşıldı</a>` : `<div>${body.text || ''}</div>`;
            div.innerHTML = `${!isMe ? `<span class="sender">${m.nickname}</span>` : ''} ${content}`;
            box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
    }

    async function send(extra = {}) {
        const inp = document.getElementById('mInp');
        if(!inp.value && !extra.type) return;
        const payload = { text: inp.value, ...extra };
        inp.value = '';
        await sb.from('messages').insert([{ nickname: user.nick, group_id: currentRoom.name, content: JSON.stringify(payload) }]);
    }

    // --- OTAQ SİSTEMİ (TƏKMİLLƏŞDİRİLMİŞ) ---
    function createNewRoom() {
        const n = prompt("Otaq adı:"); if(!n) return;
        const isZ = confirm("Məkan kilidi olsun?");
        const p = prompt("Şifrə (istəmirsinizsə boş qoyun):") || null;

        if(isZ) {
            navigator.geolocation.getCurrentPosition(pos => {
                const room = { name: n, lat: pos.coords.latitude, lng: pos.coords.longitude, isZone: true, pass: p };
                myRooms.push(room);
                saveRooms();
                enterRoom(room); // Yaradan şəxs birbaşa girir
            }, () => alert("Məkan otağı üçün GPS lazımdır!"));
        } else {
            const room = { name: n, isZone: false, pass: p };
            myRooms.push(room);
            saveRooms();
            enterRoom(room);
        }
    }

    function renderRooms() {
        const list = document.getElementById('roomList'); list.innerHTML = '';
        myRooms.forEach(r => {
            const b = document.createElement('button');
            b.className = 'btn';
            b.innerHTML = `🏠 ${r.name} ${r.isZone ? '📍' : ''} ${r.pass ? '🔒' : ''}`;
            b.onclick = () => handleJoin(r);
            list.appendChild(b);
        });
        openSheet('roomSheet');
    }

    function handleJoin(r) {
        // 1. Öncə şifrə yoxlanışı
        if(r.pass) {
            const inputPass = prompt("Bu otaq şifrəlidir. Daxil edin:");
            if(inputPass !== r.pass) return alert("Səhv şifrə!");
        }

        // 2. Sonra məkan yoxlanışı
        if(r.isZone) {
            alert("Məkan yoxlanılır...");
            navigator.geolocation.getCurrentPosition(pos => {
                const dist = getDist(pos.coords.latitude, pos.coords.longitude, r.lat, r.lng);
                if(dist > 0.2) return alert("Təəssüf, məkana uzaqsınız!");
                enterRoom(r);
            }, () => alert("GPS icazəsi verilmədi."));
        } else {
            enterRoom(r);
        }
    }

    function enterRoom(r) {
        currentRoom = r;
        document.getElementById('activeRoomName').innerText = r.name;
        closeSheets();
        loadMsgs();
    }

    // --- KÖMƏKÇİ ---
    function getDist(la1, lo1, la2, lo2) {
        const R = 6371; const dLat = (la2-la1)*Math.PI/180; const dLon = (lo2-lo1)*Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    function sendLoc() { navigator.geolocation.getCurrentPosition(p => send({type:'loc', url:`https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`})); closeSheets(); }
    function saveRooms() { localStorage.setItem('x_rooms', JSON.stringify(myRooms)); }
    function openSheet(id) { document.getElementById(id).classList.add('active'); }
    function closeSheets() { document.querySelectorAll('.sheet-overlay').forEach(s => s.classList.remove('active')); }
    function hardReset() { localStorage.clear(); location.reload(); }

    init();
</script>
</body>
</html>
